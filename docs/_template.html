<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{title}} · MPAndroidChart</title>
  <meta name="description" content="{{description}}">
  <link rel="canonical" href="{{canonical}}">
  <meta property="og:type" content="article">
  <meta property="og:site_name" content="MPAndroidChart">
  <meta property="og:title" content="{{title}} · MPAndroidChart">
  <meta property="og:description" content="{{description}}">
  <meta property="og:url" content="{{canonical}}">
  <meta property="og:image" content="https://philjay.cc/mpandroidchart/assets/og-mpandroidchart.png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <link rel="icon" type="image/png" href="/mpandroidchart/assets/favicon.png?v=3">
  <link rel="apple-touch-icon" href="/mpandroidchart/assets/apple-touch-icon.png?v=3">
  <link rel="preload" href="/assets/fonts/manrope-latin.woff2" as="font" type="font/woff2" crossorigin>
  <style data-src="styles.css"></style>
  <style data-src="mpandroidchart/docs.css"></style>
  <script src="/consent.js" defer></script>
</head>
<body class="docs">
<div class="stage">
  <header class="wrap nav">
    <a class="brand" href="/mpandroidchart/"><img src="/mpandroidchart/assets/favicon.png?v=3" alt="" width="34" height="34">MPAndroidChart</a>
    <nav class="nav-links">
      <a href="/mpandroidchart/#charts">Charts</a>
      <a href="/mpandroidchart/docs/">Guides</a>
      <a href="/mpandroidchart/#start">Get started</a>
      <a href="https://github.com/PhilJay/MPAndroidChart">GitHub</a>
    </nav>
  </header>

  <div class="wrap docs-layout">
    <aside class="docs-nav">
      <form class="docs-search" role="search" onsubmit="return false">
        <input type="search" id="docs-search" placeholder="Search the guides" aria-label="Search the guides" autocomplete="off" spellcheck="false">
        <kbd>/</kbd>
      </form>
      <div class="search-results" id="search-results" hidden></div>
      <div id="docs-nav-list">
        <span class="docs-nav-title">Guides</span>
        {{nav}}
      </div>
    </aside>
    <main class="docs-main">
      <p class="chapter-mark">{{chapter}}</p>
      {{toc}}
      {{content}}
      {{pager}}
    </main>
  </div>

  <footer class="wrap footer">
    <span>© 2026 Philipp Jahoda</span>
    <nav>
      <a href="/">All projects</a>
      <a href="https://github.com/PhilJay/MPAndroidChart">GitHub</a>
      <a href="/privacy.html">Privacy</a>
      <a href="/imprint.html">Imprint</a>
      <a href="#" data-cookie-settings>Cookie settings</a>
    </nav>
  </footer>
</div>

<script>
(function () {
  var input = document.getElementById('docs-search');
  var results = document.getElementById('search-results');
  var navList = document.getElementById('docs-nav-list');
  var records = null;
  var active = -1;

  function load() {
    if (records) return Promise.resolve(records);
    return fetch('/mpandroidchart/docs/search.json')
      .then(function (response) { return response.json(); })
      .then(function (data) { records = data; return records; })
      .catch(function () { records = []; return records; });
  }

  function score(record, words) {
    var title = record.c.toLowerCase();
    var heading = record.h.toLowerCase();
    var text = record.x.toLowerCase();
    var total = 0;
    for (var i = 0; i < words.length; i++) {
      var word = words[i];
      if (title.indexOf(word) !== -1) total += 4;
      else if (heading.indexOf(word) !== -1) total += 3;
      else if (text.indexOf(word) !== -1) total += 1;
      else return 0;
    }
    return total;
  }

  function show(query) {
    var words = query.toLowerCase().split(/\s+/).filter(Boolean);
    var found = [];
    for (var i = 0; i < records.length; i++) {
      var value = score(records[i], words);
      if (value > 0) found.push({ record: records[i], score: value });
    }
    found.sort(function (a, b) { return b.score - a.score; });
    found = found.slice(0, 12);

    if (!found.length) {
      results.innerHTML = '<p class="no-results">Nothing found for "' + query.replace(/</g, '&lt;') + '"</p>';
    } else {
      results.innerHTML = found.map(function (hit) {
        var record = hit.record;
        var href = '/mpandroidchart/docs/' + record.s + '/' + (record.a ? '#' + record.a : '');
        var heading = record.h || record.c;
        var context = record.h ? record.c : 'Chapter introduction';
        return '<a href="' + href + '"><strong>' + heading + '</strong><span>' + context + '</span></a>';
      }).join('');
    }
    active = -1;
    results.hidden = false;
    navList.hidden = true;
  }

  function clear() {
    results.hidden = true;
    results.innerHTML = '';
    navList.hidden = false;
    active = -1;
  }

  input.addEventListener('input', function () {
    var query = input.value.trim();
    if (query.length < 2) { clear(); return; }
    load().then(function () { if (input.value.trim().length >= 2) show(query); });
  });

  input.addEventListener('keydown', function (event) {
    var links = results.querySelectorAll('a');
    if (event.key === 'Escape') { input.value = ''; clear(); input.blur(); return; }
    if (!links.length) return;
    if (event.key === 'ArrowDown' || event.key === 'ArrowUp') {
      event.preventDefault();
      active += event.key === 'ArrowDown' ? 1 : -1;
      if (active < 0) active = links.length - 1;
      if (active >= links.length) active = 0;
      for (var i = 0; i < links.length; i++) links[i].classList.toggle('active', i === active);
      links[active].scrollIntoView({ block: 'nearest' });
    } else if (event.key === 'Enter') {
      event.preventDefault();
      links[active >= 0 ? active : 0].click();
    }
  });

  var initial = new URLSearchParams(window.location.search).get('q');
  if (initial) {
    input.value = initial;
    load().then(function () { show(initial.trim()); });
  }

  document.addEventListener('keydown', function (event) {
    if (event.key === '/' && document.activeElement !== input) {
      event.preventDefault();
      input.focus();
    }
  });

  document.addEventListener('click', function (event) {
    var button = event.target.closest('.copy');
    if (!button) return;
    var code = button.parentElement.querySelector('code');
    navigator.clipboard.writeText(code.innerText).then(function () {
      button.classList.add('done');
      button.textContent = 'Copied';
      setTimeout(function () { button.classList.remove('done'); button.textContent = 'Copy'; }, 1400);
    });
  });
})();
</script>
</body>
</html>
